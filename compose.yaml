x-app: &app
  image: barin-zar:local
  build: .
  env_file: .env.docker
  volumes:
    - media:/var/www/html/storage/app
  depends_on:
    mysql:
      condition: service_healthy

services:
  web:
    <<: *app
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 30
  mysql:
    image: mysql:8.4
    env_file: .env.docker
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=tcp -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -Nse "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  media:
  mysql:
